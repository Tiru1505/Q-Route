<svg viewBox="0 0 660 796" role="img" aria-label="Flowchart of the rerouting decision, from driver position through closure, degradation, improvement and alert gates" xmlns="http://www.w3.org/2000/svg" width="660" height="796"><rect x="0" y="0" width="660" height="796" fill="#ffffff"/>
          

          <rect fill="#e6e2de" stroke="#191512" stroke-width="1.4" x="180" y="12" width="240" height="44" rx="22" />
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#191512" x="300" y="39" text-anchor="middle">Traffic changed</text>

          <line fill="none" stroke="#191512" stroke-width="1.4" x1="300" y1="56" x2="300" y2="82" />

          <rect fill="none" stroke="#191512" stroke-width="1.4" x="150" y="84" width="300" height="46" rx="3" />
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#191512"  x="300" y="105" text-anchor="middle">Advance trip to driver's position</text>
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#191512" opacity="0.75" x="300" y="122" text-anchor="middle">only the road ahead is still decidable</text>

          <line fill="none" stroke="#191512" stroke-width="1.4" x1="300" y1="130" x2="300" y2="156" />

          <path fill="none" stroke="#191512" stroke-width="1.4" d="M300 158 L440 196 L300 234 L160 196 z" />
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#191512" x="300" y="200" text-anchor="middle">Road ahead closed?</text>

          <line fill="none" stroke="#7b3070" stroke-width="1.8" x1="440" y1="196" x2="560" y2="196" />
          <line fill="none" stroke="#7b3070" stroke-width="1.8" x1="560" y1="196" x2="560" y2="612" />
          <line fill="none" stroke="#7b3070" stroke-width="1.8" x1="560" y1="612" x2="452" y2="612" />
          <text font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#7b3070" x="448" y="188">yes — no choice</text>

          <line fill="none" stroke="#191512" stroke-width="1.4" x1="300" y1="234" x2="300" y2="260" />
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#191512" opacity="0.75" x="310" y="252">no</text>

          <rect fill="none" stroke="#191512" stroke-width="1.4" x="150" y="262" width="300" height="46" rx="3" />
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#191512"  x="300" y="283" text-anchor="middle">Time remaining on current route</text>
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#191512" opacity="0.75" x="300" y="300" text-anchor="middle">under the traffic that exists now</text>

          <line fill="none" stroke="#191512" stroke-width="1.4" x1="300" y1="308" x2="300" y2="334" />

          <path fill="none" stroke="#191512" stroke-width="1.4" d="M300 336 L448 376 L300 416 L152 376 z" />
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#191512"  x="300" y="373" text-anchor="middle">More than 15% off plan?</text>
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#191512" opacity="0.75" x="300" y="390" text-anchor="middle">degradation threshold</text>

          <line fill="none" stroke="#191512" stroke-width="1.4" x1="152" y1="376" x2="70" y2="376" />
          <line fill="none" stroke="#191512" stroke-width="1.4" x1="70"  y1="376" x2="70" y2="716" />
          <line fill="none" stroke="#191512" stroke-width="1.4" x1="70"  y1="716" x2="148" y2="716" />
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#191512" opacity="0.75" x="76" y="368">no</text>

          <line fill="none" stroke="#191512" stroke-width="1.4" x1="300" y1="416" x2="300" y2="442" />
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#191512" opacity="0.75" x="310" y="434">yes</text>

          <rect fill="none" stroke="#191512" stroke-width="1.4" x="150" y="444" width="300" height="46" rx="3" />
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#191512"  x="300" y="465" text-anchor="middle">Dijkstra from the current node</text>
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#191512" opacity="0.75" x="300" y="482" text-anchor="middle">provably optimal, ~1 second</text>

          <line fill="none" stroke="#191512" stroke-width="1.4" x1="300" y1="490" x2="300" y2="516" />

          <path fill="none" stroke="#191512" stroke-width="1.4" d="M300 518 L448 556 L300 594 L152 556 z" />
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#191512"  x="300" y="553" text-anchor="middle">Saves more than 5%?</text>
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#191512" opacity="0.75" x="300" y="570" text-anchor="middle">min improvement</text>

          <line fill="none" stroke="#191512" stroke-width="1.4" x1="152" y1="556" x2="110" y2="556" />
          <line fill="none" stroke="#191512" stroke-width="1.4" x1="110" y1="556" x2="110" y2="716" />
          <line fill="none" stroke="#191512" stroke-width="1.4" x1="110" y1="716" x2="148" y2="716" />
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#191512" opacity="0.75" x="112" y="548">no</text>

          <line fill="none" stroke="#191512" stroke-width="1.4" x1="300" y1="594" x2="300" y2="612" />

          <rect fill="#f0e2ee" stroke="#7b3070" stroke-width="1.8" x="180" y="614" width="272" height="46" rx="3" />
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#7b3070" x="316" y="635" text-anchor="middle">Alert engine — 5 policy gates</text>
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#191512" opacity="0.75" x="316" y="652" text-anchor="middle">cooldown · repeat growth · hysteresis · cap</text>

          <line fill="none" stroke="#191512" stroke-width="1.4" x1="316" y1="660" x2="316" y2="686" />

          <rect fill="#e6e2de" stroke="#191512" stroke-width="1.4" x="196" y="688" width="240" height="44" rx="22" />
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#191512" x="316" y="715" text-anchor="middle">Tell the driver</text>

          <rect fill="#e6e2de" stroke="#191512" stroke-width="1.4" x="20" y="694" width="128" height="44" rx="22" />
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#191512"  x="84" y="713" text-anchor="middle">Stay quiet</text>
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#191512" opacity="0.75" x="84" y="729" text-anchor="middle">and say why</text>

          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#191512" opacity="0.75" x="330" y="766">Deciding what is true and deciding what is worth saying</text>
          <text font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#191512" opacity="0.75" x="330" y="782">are kept in separate modules on purpose.</text>
        
