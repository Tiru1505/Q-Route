<svg viewBox="0 0 880 640" role="img" aria-label="UML class diagram of QROEngine, CostModel, Route, ActiveTrip, RerouteEngine, MultiStopProblem, AlertEngine and QPSO" xmlns="http://www.w3.org/2000/svg" width="880" height="640"><rect x="0" y="0" width="880" height="640" fill="#ffffff"/>
          

